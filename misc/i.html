<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Poème caché</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Ajustements spécifiques à la page Poem */
    body { margin: 0; font-family: inherit; }
    main { margin-right: 320px; padding: 40px; line-height: 1.6; }
    aside#annotation-panel {
      position: fixed; top: 0; right: 0;
      width: 300px; height: 100vh;
      background: #f9f9f9; border-left: 1px solid #ddd;
      overflow-y: auto; padding: 20px;
      box-sizing: border-box;
    }
    aside#annotation-panel h2 { margin-top: 0; }
    .annotated { cursor: pointer; transition: background 0.3s; }
    .annotated.active { background: rgba(74,118,238,0.2); }
    /* coloration par type */
    .annotated[data-type="comment"] { }
    .annotated[data-type="note"] { }
    #annotation-list li {
      margin: 0 0 12px;
      padding-left: 8px;
      border-left: 4px solid;
    }
  </style>
</head>
<body>

  <!-- 2) Contenu principal : ton poème -->
  <main>
    <h1>Mon Poème Caché</h1>
    <p>
      Voici quelques vers <span class="annotated" data-type="comment" data-note="Cette phrase exprime l'idée de solitude.">solitaires</span>  
      flottant dans la nuit,  
      je contemple l’ombre <span class="annotated" data-type="note" data-note="Référence au clair-obscur">du clair</span>  
      et de l’obscur.  
    </p>
    <p>
      <span class="annotated" data-type="comment" data-note="Métaphore sur le temps qui passe.">Le temps s’effrite</span>  
      comme un vieux sable,  
      et chaque grain <span class="annotated" data-type="note" data-note="Image d’un souvenir qui persiste.">garde un souvenir</span>  
      enfoui sous l’écume.
    </p>
    <!-- ... autres strophes ... -->
  </main>

  <!-- 3) Panneau d’annotations à droite -->
  <aside id="annotation-panel">
    <h2>Annotations</h2>
    <ul id="annotation-list"></ul>
  </aside>

  <!-- 4) Script d’initialisation des annotations -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const annos = document.querySelectorAll(".annotated");
      const list = document.getElementById("annotation-list");

      annos.forEach((el, i) => {
        const type = el.dataset.type;
        const note = el.dataset.note;
        // Création de l’item dans le panneau
        const li = document.createElement("li");
        li.textContent = note;
        // couleur selon type
        li.style.borderColor = type === "comment" ? "#f0ad4e" : "#5bc0de";
        // click sur annotation du panneau
        li.addEventListener("click", () => {
          annos.forEach(a => a.classList.remove("active"));
          el.classList.add("active");
          el.scrollIntoView({ behavior: "smooth", block: "center" });
        });
        list.appendChild(li);

        // click sur le texte pour activer la note
        el.addEventListener("click", () => {
          annos.forEach(a => a.classList.remove("active"));
          el.classList.add("active");
        });
      });
    });
  </script>
</body>
</html>
